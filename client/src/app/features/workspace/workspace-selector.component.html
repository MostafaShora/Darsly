@if (state(); as workspaceState) {
  @if (simpleMode()) {
    <span
      class="inline-flex min-h-10 items-center gap-2 rounded-xl border border-[#e1ebe4] bg-white px-3 text-xs font-bold text-[#38554a]"
      aria-label="مساحة العمل الحالية"
    >
      <span class="text-[#71847a]">مساحة العمل</span>
      <span class="max-w-40 truncate">{{ workspaceState.activeWorkspace?.name }}</span>
    </span>
  } @else if (workspaceState.workspaces.length > 0) {
    <label class="inline-flex flex-wrap items-center gap-2 text-xs font-bold text-[#38554a]">
      <span>مساحة العمل</span>
      <app-custom-select
        class="w-56 max-w-full"
        controlId="workspace-selector"
        size="compact"
        [options]="workspaceSelectOptions()"
        [value]="selectedWorkspaceId() ?? ''"
        [placeholder]="!selectedWorkspaceId() || !workspaceState.workspaces.some((workspace) => workspace._id === selectedWorkspaceId()) ? 'اختر مساحة عمل' : ''"
        [placeholderDisabled]="true"
        ariaLabel="اختيار مساحة العمل"
        (valueChange)="selectWorkspace($event)"
      ></app-custom-select>
      @if (workspaceState.activeWorkspace === null && activeWorkspaces().length > 0) {
        <span class="basis-full text-[11px] font-medium text-[#8a5b20]" role="status">
          @if (selectedWorkspace()?.status === 'suspended') {
            مساحة العمل المحددة معلّقة. اختر مساحة نشطة للمتابعة.
          } @else {
            اختر مساحة عمل نشطة لعرض بياناتها.
          }
        </span>
      }
    </label>
  }
  @if (selectionPersistenceError()) {
    <span class="block text-[11px] font-medium text-[#9a4f36]" role="status">
      {{ selectionPersistenceError() }}
    </span>
  }
}
