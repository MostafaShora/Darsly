<router-outlet />
@if (authService.isCheckingSession()) {
  <main
    class="fixed inset-0 z-[100] grid min-h-screen grid-cols-1 gap-6 bg-[#f5f8f6] p-4 md:grid-cols-[220px_minmax(0,1fr)] md:p-6 lg:grid-cols-[252px_minmax(0,1fr)]"
    aria-busy="true"
    aria-live="polite"
    aria-label="جارٍ التحقق من الجلسة"
  >
    <div
      class="hidden min-h-full animate-pulse rounded-2xl border border-[#e4ece6] bg-white motion-reduce:animate-none md:block"
    ></div>
    <div class="grid content-start gap-5">
      <div
        class="h-14 animate-pulse rounded-xl border border-[#e4ece6] bg-white motion-reduce:animate-none"
      ></div>
      <div
        class="h-52 animate-pulse rounded-2xl border border-[#e4ece6] bg-white motion-reduce:animate-none"
      ></div>
      <div class="grid grid-cols-2 gap-3 xl:grid-cols-4">
        @for (card of [1, 2, 3, 4]; track card) {
          <div
            class="h-36 animate-pulse rounded-2xl border border-[#e4ece6] bg-white motion-reduce:animate-none"
          ></div>
        }
      </div>
      <div class="grid gap-4 xl:grid-cols-2">
        <div
          class="h-56 animate-pulse rounded-2xl border border-[#e4ece6] bg-white motion-reduce:animate-none"
        ></div>
        <div
          class="h-56 animate-pulse rounded-2xl border border-[#e4ece6] bg-white motion-reduce:animate-none"
        ></div>
      </div>
    </div>
  </main>
}
