<section aria-labelledby="student-profile-heading">
  <header class="mb-5">
    <p class="text-xs font-extrabold text-[#087b59]">حسابك</p>
    <h2 id="student-profile-heading" class="mt-2 text-2xl font-black text-[#183e32]">
      ملفي الشخصي
    </h2>
    <p class="mt-2 text-xs leading-7 text-[#5f7469] sm:text-sm">
      هذه الصفحة للعرض فقط. لم يتم توصيل بيانات الملف الشخصي بعد.
    </p>
  </header>

  <div class="grid gap-4 lg:grid-cols-2">
    <section class="rounded-2xl border border-[#e2ebe4] bg-white p-5 sm:p-6">
      <h3 class="text-sm font-extrabold text-[#29483d]">البيانات الأساسية</h3>
      <div class="mt-5 space-y-3" aria-hidden="true">
        <div class="h-3 w-1/3 rounded-full bg-[#edf2ee]"></div>
        <div class="h-10 rounded-xl border border-[#edf2ee] bg-[#fafcfb]"></div>
        <div class="h-3 w-1/4 rounded-full bg-[#edf2ee]"></div>
        <div class="h-10 rounded-xl border border-[#edf2ee] bg-[#fafcfb]"></div>
      </div>
      <p class="mt-4 text-xs leading-6 text-[#71847a]">
        ستظهر البيانات التي يسمح بها النظام بعد ربط واجهة الملف الشخصي.
      </p>
    </section>

    <section class="rounded-2xl border border-[#e2ebe4] bg-white p-5 sm:p-6">
      <h3 class="text-sm font-extrabold text-[#29483d]">المعلومات الدراسية</h3>
      <div class="mt-5 space-y-3" aria-hidden="true">
        <div class="h-3 w-2/5 rounded-full bg-[#edf2ee]"></div>
        <div class="h-10 rounded-xl border border-[#edf2ee] bg-[#fafcfb]"></div>
        <div class="h-3 w-1/3 rounded-full bg-[#edf2ee]"></div>
        <div class="h-10 rounded-xl border border-[#edf2ee] bg-[#fafcfb]"></div>
      </div>
      <p class="mt-4 text-xs leading-6 text-[#71847a]">
        لا يتم عرض بيانات طالب أو مساحة عمل قبل التحقق من سياق الربط.
      </p>
    </section>
  </div>

  <div class="mt-4">
    <app-student-portal-pending-state
      icon="users-round"
      heading="تكامل الملف الشخصي قيد التجهيز"
      description="لن يتم عرض قيم أو إتاحة تعديلها حتى يتوفر تكامل خلفي آمن ويُعتمد نطاق البيانات المسموح."
    />
  </div>
</section>
