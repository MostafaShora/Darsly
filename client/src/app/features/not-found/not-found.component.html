<main
  class="grid min-h-screen place-items-center bg-[#f7faf8] px-4 py-10 text-[#173b32]"
  dir="rtl"
  lang="ar"
>
  <section
    class="w-full max-w-xl rounded-3xl border border-[#e1ebe4] bg-white p-6 text-center shadow-sm sm:p-10"
    aria-labelledby="not-found-heading"
  >
    <a
      class="mx-auto flex h-14 w-36 items-center justify-center rounded-xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-emerald-700"
      routerLink="/"
      aria-label="العودة إلى الصفحة الرئيسية"
    >
      <img
        class="h-full w-full object-contain"
        src="/assets/images/logo/Darsly-Logo-optimized.png"
        alt="دارسلي"
      />
    </a>

    <p class="mt-8 text-6xl font-black tracking-tight text-[#087b59]" aria-hidden="true">404</p>
    <h1 id="not-found-heading" class="mt-3 text-2xl font-black sm:text-3xl">
      الصفحة غير موجودة
    </h1>
    <p class="mx-auto mt-3 max-w-md text-sm leading-7 text-[#5f7469]">
      قد يكون الرابط غير صحيح، أو أن الصفحة التي تبحث عنها لم تعد متاحة.
    </p>

    <div class="mt-7 flex flex-wrap justify-center gap-3">
      <a
        class="inline-flex min-h-11 items-center justify-center rounded-xl bg-[#087b59] px-5 text-sm font-extrabold text-white transition-colors hover:bg-[#066b4e] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700"
        routerLink="/dashboard"
      >
        العودة إلى لوحة التحكم
      </a>
      <a
        class="inline-flex min-h-11 items-center justify-center rounded-xl border border-[#dce8df] px-5 text-sm font-bold text-[#38554a] transition-colors hover:bg-[#f2faf4] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700"
        routerLink="/"
      >
        الصفحة الرئيسية
      </a>
    </div>
  </section>
</main>
